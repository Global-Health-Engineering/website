project:
  type: website
  # Only these files become pages. The prompt archive (prompts/) and the
  # 2023 draft in open-science/ stay in the repository and out of the site.
  render:
    - "*.qmd"
    - "LICENSE.md"
    - "!prompts/"
    - "!open-science/"

# Colours, fonts and logos: a copy of the Global Health Engineering brand,
# see README.md for where it comes from. Quarto applies a project brand to
# every format, so each reveal.js deck in slides/ carries "brand: false"
# and keeps the look it was given with.
brand: _brand/_brand.yml

lang: en

website:
  page-navigation: true
  title: "Global Health Engineering"
  description: "Slides, tutorials and other open educational material of the Global Health Engineering group at ETH Zurich."
  site-url: "https://ghe-open.ch/"
  favicon: _brand/logos/eth-ghe-icon-vector.svg
  open-graph: true
  page-footer:
    left: |
      [Global Health Engineering, ETH Zurich](https://ghe.ethz.ch/)
    right:
      - icon: github
        href: https://github.com/Global-Health-Engineering
        aria-label: GitHub
  navbar:
    background: primary
    title: false
    logo: _brand/logos/eth-ghe-icon-vector-white.svg
    logo-alt: "Global Health Engineering"
    tools:
      - icon: github
        href: https://github.com/Global-Health-Engineering/website
        aria-label: Source of this website on GitHub
    left:
      - href: slides/index.qmd
        text: Slides
      - href: tutorials/index.qmd
        text: Tutorials
      - href: blog/index.qmd
        text: Blog
        
      
format:
  html:
    theme: [brand, style/theme.scss]
    toc: true
    code-copy: true
    code-overflow: wrap

# Plausible analytics on every page and every reveal.js deck. Kept outside
# the format block on purpose: a second format under "format:" makes each
# page without its own format render twice into the same output file.
include-in-header:
  - text: |
      <script defer data-domain="ghe-open.ch" src="https://plausible.io/js/script.js"></script>

execute: 
  freeze: auto


