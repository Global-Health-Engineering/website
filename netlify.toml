[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@quarto/netlify-plugin-quarto"

# Old folder name of 2023. The data package tutorial of 9 June 2023 still
# links to it, and its text is kept as it was written.
[[redirects]]
  from = "/1-slides/*"
  to = "/slides/"
  status = 301

# The source of this deck was removed in 2024 and its PDF stayed. Older
# pages link to the deck address.
[[redirects]]
  from = "/slides/d03-hubris-to-hope-reference-management.html"
  to = "https://github.com/Global-Health-Engineering/website/raw/main/slides/d03-hubris-to-hope-reference-management.pdf"
  status = 302
